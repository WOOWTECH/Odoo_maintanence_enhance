<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="32" cy="58" rx="16" ry="3" fill="#C1DBF6"/>
  <!-- Machine body -->
  <rect x="14" y="16" width="28" height="32" rx="3" fill="white" stroke="#374874" stroke-width="1.5"/>
  <!-- Machine top panel -->
  <rect x="14" y="16" width="28" height="10" rx="3" fill="#C1DBF6" stroke="#374874" stroke-width="1.5"/>
  <!-- Screen/display -->
  <rect x="19" y="19" width="12" height="5" rx="1" fill="white" stroke="#374874" stroke-width="0.8"/>
  <!-- Indicator lights -->
  <circle cx="35" cy="20" r="1.5" fill="#374874"/>
  <circle cx="35" cy="24" r="1.5" fill="#FBDBD0"/>
  <!-- Ventilation lines -->
  <line x1="19" y1="31" x2="37" y2="31" stroke="#C1DBF6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19" y1="34" x2="37" y2="34" stroke="#C1DBF6" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19" y1="37" x2="37" y2="37" stroke="#C1DBF6" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Door/hatch -->
  <rect x="22" y="40" width="12" height="6" rx="1" fill="none" stroke="#374874" stroke-width="0.8"/>
  <circle cx="32" cy="43" r="0.8" fill="#374874"/>
  <!-- Legs -->
  <rect x="17" y="48" width="4" height="4" rx="0.5" fill="#FBDBD0" stroke="#374874" stroke-width="0.8"/>
  <rect x="35" y="48" width="4" height="4" rx="0.5" fill="#FBDBD0" stroke="#374874" stroke-width="0.8"/>
  <!-- Gear (top right) -->
  <g transform="translate(40, 8)">
    <circle cx="8" cy="8" r="5" fill="#FBDBD0" stroke="#374874" stroke-width="1.2"/>
    <circle cx="8" cy="8" r="2" fill="white" stroke="#374874" stroke-width="0.8"/>
    <!-- Gear teeth -->
    <rect x="6.5" y="1.5" width="3" height="2" rx="0.5" fill="#FBDBD0" stroke="#374874" stroke-width="0.6"/>
    <rect x="6.5" y="12.5" width="3" height="2" rx="0.5" fill="#FBDBD0" stroke="#374874" stroke-width="0.6"/>
    <rect x="1.5" y="6.5" width="2" height="3" rx="0.5" fill="#FBDBD0" stroke="#374874" stroke-width="0.6"/>
    <rect x="12.5" y="6.5" width="2" height="3" rx="0.5" fill="#FBDBD0" stroke="#374874" stroke-width="0.6"/>
  </g>
</svg>
